name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Extensions & Package Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build ExternalGameTracker
        run: |
          dotnet restore extensions/ExternalGameTracker/ExternalGameTracker.csproj
          dotnet build extensions/ExternalGameTracker/ExternalGameTracker.csproj -c Release

      - name: Download Playnite Toolbox
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          New-Item -ItemType Directory -Path "tools" -Force | Out-Null
          Write-Host "Consultando versão mais recente do Playnite..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/JosefNemec/Playnite/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*.7z" } | Select-Object -First 1
          Write-Host "Baixando: $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "tools\playnite.7z"
          7z x "tools\playnite.7z" -o"tools\playnite" -y | Out-Null
          Write-Host "Playnite Toolbox pronto para empacotamento."

      - name: Package Extension (.pext)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          & "tools\playnite\Toolbox.exe" pack "extensions\ExternalGameTracker\bin\Release" "dist"
          Get-ChildItem -Path "dist"

      - name: Package Custom Helium Theme (.zip)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path "themes\Helium\*" -DestinationPath "dist\Helium-Custom-Theme.zip" -Force
          Get-ChildItem -Path "dist"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Playnite Extensions & Themes (${{ github.ref_name }})
          body: |
            ## 🚀 Release ${{ github.ref_name }}

            Compilação automática gerada pelo GitHub Actions para o repositório **playnite-extensions**.

            ### 📦 Itens Disponíveis:
            - **ExternalGameTracker (`.pext`)**: Extensão C# para rastreamento de processos externos (Zero Polling WMI, O(1) Cache, Anti-Cheat Safe).
            - **Helium Custom Theme (`Helium-Custom-Theme.zip`)**: Tema Helium com suporte nativo ao estado rodando (Badge minimalista, Botão Stop ⏹, Borda Neon e Título destacado).

            ### ⚡ Instalação Rápida via PowerShell (1 Comando):
            ```powershell
            irm https://raw.githubusercontent.com/flaviobuarque/playnite-extensions/main/install.ps1 | iex
            ```
          draft: false
          prerelease: false
          files: |
            dist/*.pext
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
